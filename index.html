<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que la página use el ancho real del celular (sin esto se ve diminuta) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finanzas</title>
  <!-- Ficha de la app: nombre, ícono y colores al instalarla -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#121417">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Aviso de sin señal / registros pendientes de envío -->
  <div id="conexion" class="conexion" hidden></div>

  <main>
    <h1>Nuevo movimiento</h1>

    <form id="formulario" novalidate>
      <!-- Dos "radio buttons": solo se puede elegir uno a la vez -->
      <fieldset class="tipo">
        <legend>Tipo</legend>
        <label><input type="radio" name="tipo" value="Egreso" checked><span>Egreso</span></label>
        <label><input type="radio" name="tipo" value="Ingreso"><span>Ingreso</span></label>
      </fieldset>

      <label for="monto">Monto</label>
      <!-- type="text" para poder mostrar los puntos ($15.000);
           inputmode="numeric" igual abre el teclado numérico -->
      <input id="monto" type="text" inputmode="numeric" placeholder="$0" autocomplete="off">

      <label for="categoria">Categoría</label>
      <select id="categoria"></select>

      <label for="concepto">Concepto</label>
      <!-- list="sugerencias" conecta el campo con las sugerencias -->
      <input id="concepto" type="text" maxlength="100" placeholder="Ej: almuerzo" list="sugerencias" autocomplete="off">
      <datalist id="sugerencias"></datalist>

      <label for="fecha">Fecha</label>
      <input id="fecha" type="date">

      <button id="guardar" type="submit">Guardar</button>
    </form>

    <section class="gastos">
      <div class="gastos-cabecera">
        <div>
          <!-- El título, el total y la pista cambian según Egreso / Ingreso -->
          <h2 id="titulo-lista">Gastos últimos 7 días</h2>
          <p id="total-lista">$0</p>
        </div>
        <button id="actualizar" type="button" aria-label="Actualizar">↻</button>
      </div>
      <p id="pista-lista" class="pista">Toca un gasto para editarlo o borrarlo</p>
      <div id="lista"></div>
    </section>
  </main>

  <!-- Mensaje inferior (con botón Deshacer cuando corresponde) -->
  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-texto"></span>
    <button id="toast-deshacer" type="button">Deshacer</button>
  </div>

  <!-- Ventana de pregunta: "¿Monto correcto?", "¿Eliminar?" -->
  <dialog id="dialogo-pregunta">
    <h3 id="pregunta-titulo"></h3>
    <p id="pregunta-mensaje"></p>
    <div class="dialogo-botones derecha">
      <button type="button" id="pregunta-no" class="secundario"></button>
      <button type="button" id="pregunta-si"></button>
    </div>
  </dialog>

  <!-- Ventana para editar o borrar un gasto -->
  <dialog id="dialogo-editar">
    <form id="form-editar" novalidate>
      <h3 id="editar-titulo">Editar gasto</h3>

      <label for="editar-monto">Monto</label>
      <input id="editar-monto" type="text" inputmode="numeric" autocomplete="off">

      <label for="editar-categoria">Categoría</label>
      <select id="editar-categoria"></select>

      <label for="editar-concepto">Concepto</label>
      <input id="editar-concepto" type="text" maxlength="100" list="sugerencias-editar" autocomplete="off">
      <datalist id="sugerencias-editar"></datalist>

      <label for="editar-fecha">Fecha</label>
      <input id="editar-fecha" type="date">

      <div class="dialogo-botones">
        <button type="button" id="editar-eliminar" class="peligro">Eliminar</button>
        <span class="espacio"></span>
        <button type="button" id="editar-cancelar" class="secundario">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
